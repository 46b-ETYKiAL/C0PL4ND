# cargo-mutants configuration (https://mutants.rs).
#
# Mutation testing measures whether the test suite actually CATCHES bugs: it
# injects small changes (mutants) into the code and checks a test fails. A
# "missed" mutant is a line the tests run but do not actually assert on — a
# coverage blind spot that line-coverage alone cannot see.
#
# Run locally:   cargo mutants                 # full sweep
#                cargo mutants --in-diff <(git diff origin/master)   # PR-scoped
# CI runs the diff-scoped form on every PR (.github/workflows/mutants.yml).

# Tests of a real PTY / terminal can be slow; give a generous multiple of the
# baseline test time before a mutant is judged "timed out" (vs genuinely caught).
timeout_multiplier = 5.0
minimum_test_timeout = 120

# Focus mutation effort on the high-signal pure logic — the VT parser, grid
# model, config, theming, layout — where a missed mutant is a real test gap.
# The GPU/egui render path and binary entry-point shells are driven by the
# kittest interaction tests and are not productive mutation targets.
#
# The app's update_engine is included because it is the one piece of app-crate
# logic that is a SECURITY boundary rather than render code: it decides whether a
# downloaded binary is installed. It is pure logic (sha256 + minisign verify +
# manifest parse), so it mutates and tests exactly like core does. Measured
# before adding it — verify.rs is 12 mutants, 12 caught, 0 missed (including
# `verify_artifact_bound -> Ok(())`, i.e. the whole gate accepting any artifact,
# and `verify_checksum -> true`) — so this glob RATCHETS existing strength in; it
# is not a new debt. Until now no app mutant had ever been run.
#
# !! The `**/` prefix is LOAD-BEARING — do NOT "tidy" it to match the real
# directory layout. update_engine is reached through a `#[path]` attribute, so
# cargo-mutants records its mutants under
# `crates/app/src/egui_app/../update_engine/…`. A glob written against the actual
# on-disk path therefore matches NOTHING, and zero selected mutants EXITS 0 —
# indistinguishable from "nothing survived". Measured on this tree:
#
#   crates/app/src/update_engine/**  -> 2560 total,   0 update_engine  <- FALSE GREEN
#   **/update_engine/*.rs            -> 2880 total, 320 update_engine  <- correct
#
# `.github/workflows/mutants.yml` asserts update_engine still selects >0, so a
# rename or a "helpful" path tidy-up cannot silently empty this gate again.
#
# !! The SECOND `**` is equally load-bearing, and the >0 canary CANNOT catch its
# absence. `**/update_engine/*.rs` is SINGLE-LEVEL: it matches files sitting
# directly in `update_engine/` and nothing in a subdirectory. `net.rs` there is
# ~2.5k lines and is the security boundary (sha256, minisign, host allowlist) —
# the most likely file in the repo to be decomposed into a subdirectory, and the
# worst one to stop mutating. Splitting it would have dropped its mutants out of
# the gate SILENTLY and PARTIALLY: the sibling files still select, so the
# workflow's >0 assertion stays green while the split-out code is no longer
# tested at all.
#
# Measured on this tree, with a temporary submodule planted under update_engine/
# and removed again:
#
#   **/update_engine/*.rs      -> 329 update_engine, 0 from the subdirectory
#                                 (canary still GREEN — the silent partial loss)
#   **/update_engine/**/*.rs   -> 334 update_engine, 5 from the subdirectory
#
# And with no subdirectory present the two select IDENTICALLY (3259 total / 329
# update_engine, byte-identical `--list` output), so widening it costs nothing
# today and is purely insurance against tomorrow's decomposition.
examine_globs = ["crates/core/src/**", "**/update_engine/**/*.rs"]

exclude_globs = [
    "crates/*/benches/**",
    "crates/*/tests/**",
    "**/build.rs",
    "crates/core/src/term/tests.rs",
    # Thin cfg(windows) OS-flag shim: its only real branch — applying
    # CREATE_NO_WINDOW via CommandExt::creation_flags — is `#[cfg(windows)]`
    # and is therefore NOT compiled on the Linux mutants runner, so no test can
    # ever kill a mutant in it here (the non-Windows branch is a bare `self`).
    # Same class as the render/entry-shell exclusions above: not a productive
    # mutation target on this runner. Correctness is pinned by its unit tests.
    "crates/core/src/win_process.rs",
]

# `--in-diff` mode does not honour exclude_globs for a file that is inside
# examine_globs, so also exclude the cfg(windows)-only shim by mutant name.
# exclude_re matches the generated mutant description (function path), which is
# the reliable filter for a single un-testable-on-Linux function.
exclude_re = [
    "no_console_window",
    # PROVABLY EQUIVALENT, not merely hard to kill. `push_decrqss_byte` caps the
    # DECRQSS selector buffer at 64 bytes; widening `<` to `<=` caps it at 65.
    # `put` writes nothing else on that branch, and the buffer's ONLY consumer
    # (`unhook` -> `report_decrqss`) matches it against exactly `b"m"`, `b"r"`
    # and `b" q"` — lengths 1, 1 and 2. Both a 64- and a 65-byte buffer are
    # therefore unrecognised and produce the identical invalid reply, so no
    # input can distinguish the two programs.
    #
    # !! Scoped to the EXTRACTED HELPER on purpose, and the narrowness is
    # MEASURED rather than asserted. `cargo mutants --list -f crates/core/src/term.rs`
    # selects 3259 mutants; of the helper's four only `< -> <=` is filtered out,
    # and BOTH `< -> <=` mutants inside `put` (2504:26 sixel, 2509:26 XTGETTCAP)
    # remain selected. Those two still share ONE description string —
    # `replace < with <= in <impl Perform for Screen>::put` — which is exactly
    # why a description-based exclusion written against `put` could never be
    # surgical: it cannot name one of them without taking the other.
    #
    # The XTGETTCAP cap is the one that must not be pardoned. Its off-by-one is
    # observable: a >=4097-byte payload is truncated to 4096 (even -> decodes ->
    # the reply quotes back a 4096-char hex name) versus 4097 (odd ->
    # `hex_decode_bytes` returns `None` -> the reply is the BARE unknown form).
    # Two different byte strings on the wire (4103 bytes vs 7). Measured on this
    # tree, applying `buf.len() <= 4096` at 2509 USED TO leave the whole core lib
    # suite GREEN (931 passed) — so it was not merely a hole that would open "the
    # day the line enters a diff", it was a live, reachable, uncaught mutant, and
    # the broad regex would have pardoned it permanently and silently. It is now
    # KILLED by `xtgettcap_payload_cap_truncates_on_an_even_hex_boundary`, which
    # drives a 5000-byte name and asserts the quoted-back reply byte-for-byte.
    # Nothing here is deferred: the DECRQSS cap is pardoned because it is provably
    # equivalent, and this one is killed because it provably is not.
    #
    # The helper's other THREE mutants stay live and are all verified killed by
    # the DECRQSS reply tests (6 failures each): `replace < with ==`,
    # `replace < with >` (both leave `buf.len()` never below the cap on the
    # first byte, so the buffer stays empty) and `replace push_decrqss_byte
    # with ()`. Only `< -> <=` is excluded, and it survives the full suite
    # (931 passed) as the equivalence argument above predicts.
    "replace < with <= in push_decrqss_byte",
]

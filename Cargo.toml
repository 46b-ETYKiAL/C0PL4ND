# C0PL4ND — a cross-platform, GPU-accelerated terminal emulator.
# "The operator's shell into the wired."
[workspace]
resolver = "2"
members = ["crates/core", "crates/renderer", "crates/app"]
# The cargo-fuzz crate is its own workspace and requires a nightly,
# sanitizer-instrumented toolchain — keep it out of the default `cargo build`
# / `cargo test --workspace` graph so the stable CI matrix is unaffected.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.25"
edition = "2021"
# True floor, established empirically (`cargo check --workspace --locked` under
# RUSTUP_TOOLCHAIN=<ver>), not asserted. Three independent constraints, highest
# wins:
#   1.95  `sysinfo` 0.39.6 — a NORMAL dependency of c0pl4nd-core — declares
#         rust-version 1.95. Cargo refuses outright below it: "rustc 1.92.0 is
#         not supported by the following package: sysinfo@0.39.6 requires
#         rustc 1.95". This is the binding constraint.
#   1.87  `is_multiple_of` (crates/core/src/term.rs, crates/core/src/layout/
#         action.rs, crates/app/src/window.rs). Not negotiable by rewriting:
#         clippy 1.95 under `-D warnings` REJECTS the MSRV-safe `% 2 != 0` form
#         via `manual_is_multiple_of`, so the lint set itself forces the 1.87 API.
#   1.82  `is_none_or` (crates/core/src/image.rs, crates/app/src/egui_app/mod.rs).
# The previous value (1.80) was provably false on all three counts — and the
# tree does not even RESOLVE on 1.80 (a transitive dep needs edition2024, which
# cargo 1.80 cannot parse). It went unnoticed because the `msrv` CI job was
# vacuous: rust-toolchain.toml's directory override outranked the toolchain the
# job installed, so the job re-tested the pinned channel. See the RUSTUP_TOOLCHAIN
# comment on the `msrv` job in .github/workflows/ci.yml.
# Bump this, the `msrv` job's `toolchain:`, and its RUSTUP_TOOLCHAIN together.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/46b-ETYKiAL/Itasha.Corp_C0PL4ND"
repository = "https://github.com/46b-ETYKiAL/Itasha.Corp_C0PL4ND"
authors = ["Itasha.Corp"]
description = "A fast, GPU-accelerated, local-first terminal emulator for Windows, Linux, and macOS."

[workspace.dependencies]
# Production deps exact-pinned (=X.Y.Z) per dependency-management.md. The pinned
# version IS the version already resolved in the committed Cargo.lock — this is a
# manifest-only tightening (no lockfile change, no upgrade) that stops `cargo
# update` from silently floating production deps (supply-chain drift defence).
anyhow = "=1.0.104"
thiserror = "=2.0.19"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=1.1.3"

# --- W1TN3SS opt-in crash/error/issue reporting SDK (first-party, pinned git
#     rev; default-OFF, consent-gated, no vendor SaaS/telemetry). Consumed as a
#     pure dependency — this app authors no SDK code (the fleet-rollout
#     integration). Pinned to the EXACT commit rev (dependency-management.md) so
#     an SDK change cannot float into the app until it explicitly bumps. The pin
#     is the W1TN3SS `main` HEAD that carries the content-scrubbing (PR#1) +
#     crash-capture (PR#3) hardening which landed AFTER the
#     `itasha-report-core-v0.2.0` tag (that tag points at an ancestor WITHOUT the
#     hardening, and there is no tag on HEAD — so the bump is by rev, not tag).
#     The crate's own version field stays "0.2.0" (unchanged in the SDK). ---
itasha-report-core = { git = "https://github.com/46b-ETYKiAL/Itasha.Corp_S4F3-W1TN3SS.git", rev = "7464eab1e4b7374f811ea4668b4696b0a533f2fc" }

# --- W1TN3SS opt-in Tor-onion transport (first-party, SAME pinned rev). A
#     SEPARATE crate so report-core's dependency tree stays unchanged for the
#     default (non-opt-in) build. This crate pulls the Arti pure-Rust Tor stack;
#     it is compiled in unconditionally but only EXERCISED when the user
#     configures an onion address (`C0PL4ND_REPORT_ONION`). Default = clearnet —
#     nothing changes for users who never set an onion address. ---
itasha-report-transport-tor = { git = "https://github.com/46b-ETYKiAL/Itasha.Corp_S4F3-W1TN3SS.git", rev = "7464eab1e4b7374f811ea4668b4696b0a533f2fc" }

# --- GPU/windowing anchor (promoted to workspace so the egui bundle and the
#     existing terminal-grid renderer share ONE pinned wgpu/winit/glyphon). ---
# These resolve to wgpu 29.0.3 / winit 0.30.13 / glyphon 0.11.0 — the same set
# the reference egui app (SCR1B3) locks, so eframe and glyphon can share one
# wgpu::Device with no duplicate-wgpu-in-the-tree problem (recon dossier §0/§1).
wgpu = "=29.0.4"
winit = "=0.30.13"
glyphon = "=0.11.0"

# --- egui bundle (Milestone 1: chrome only) — versions proven mutually
#     compatible with wgpu 29 by SCR1B3's Cargo.lock (recon dossier §1.1). ---
eframe = { version = "=0.34.3", default-features = false, features = [
    "wgpu",          # wgpu backend — shares Device/Queue with glyphon (Milestone 2)
    "default_fonts",
    "accesskit",     # a11y tree (also what egui_kittest queries in tests)
    "wayland",
    "x11",
    "persistence",   # native window pos+size restore (#24/#25) + App::save() firing on exit/interval — ron state stored under the with_app_id folder
] }
egui = "=0.34.3"
egui-wgpu = "=0.34.3"
egui_tiles = "=0.15.0"
egui-phosphor = { version = "=0.12.0", default-features = false, features = ["thin", "fill"] }
window-vibrancy = "=0.7.1" # OS glass/acrylic/mica/vibrancy (MIT/Apache-2.0); exact-pinned per dependency-management.md

[profile.release]
opt-level = 3
# Fat LTO over thin: a terminal's hot path (VT parse + grid) benefits from
# cross-crate inlining between `core` and `app`; the extra release build time is
# acceptable for a shipped binary (CI build matrix already tolerates it).
lto = "fat"
codegen-units = 1
strip = true
# Abort on panic in release builds. (1) Smaller binary — no unwind tables /
# landing pads. (2) The terminal has 21 `unsafe` Win32/winit FFI blocks;
# unwinding a panic across the C ABI is UB, so a deterministic abort is the safe
# failure mode. (3) A panic in the PTY reader thread on hostile input should kill
# the process cleanly, not leave a wedged zombie pane. Tests run in the dev/test
# profile (unwind preserved), so `#[should_panic]` is unaffected. The cargo-fuzz
# crate is a separate excluded workspace and sets its own panic strategy.
panic = "abort"

# Workspace-wide unsafe-code discipline. Every `unsafe {}` block in the tree must
# carry an accurate `// SAFETY:` comment justifying why the operation is sound,
# each block holds at most ONE unsafe operation, and `unsafe fn` bodies must still
# wrap their unsafe operations in explicit `unsafe {}` blocks (no implicit unsafe
# in an unsafe fn). Member crates opt in via `[lints] workspace = true`.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

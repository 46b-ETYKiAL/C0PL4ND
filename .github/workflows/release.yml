name: Release

# Hardened release for C0PL4ND. Improvements over the baseline release.yml:
#   - SLSA build provenance attestation (actions/attest-build-provenance) on
#     every shipped binary + installer (SLSA v1 Build L2 on public repos via the
#     public-good Sigstore instance; verifiable with `gh attestation verify`).
#   - CycloneDX SBOM (cargo-cyclonedx) generated and published per release.
#   - All third-party actions pinned by full commit SHA.
#   - Least-privilege permissions; id-token + attestations scopes granted only
#     to the jobs that need them.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build a release for (e.g. v1.2.3)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: c0pl4nd

jobs:
  # --------------------------------------------------------------------------
  # License-delivery gate. Runs BEFORE anything is built so a release can never
  # publish an artifact that omits the license texts it is legally required to
  # carry. The shipped binary embeds ~22 OFL-1.1 / Apache-2.0 typefaces via
  # include_bytes!, and OFL-1.1 s2 requires the license to accompany every copy.
  #
  # This asserts over the packaging manifest (this workflow + the packaging
  # scripts) and the repo tree -- it builds nothing, so it is seconds, not
  # minutes. Every other job gates on it via `needs:`.
  # --------------------------------------------------------------------------
  license-delivery:
    name: License delivery (fonts must ship their licenses)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user --disable-pip-version-check pyyaml
      - name: Verify every artifact path stages its license texts
        run: python3 packaging/verify_license_delivery.py
      - name: Verify the collector itself produces a complete license set
        run: |
          set -euo pipefail
          sh packaging/collect-licenses.sh "${PWD}" /tmp/license-probe
          echo "--- staged tree ---"
          find /tmp/license-probe -type f | sort
          # A tree with no font licenses means the collector silently no-op'd.
          n=$(find /tmp/license-probe/licenses/fonts -type f | wc -l)
          [ "$n" -gt 0 ] || { echo "::error::no font licenses staged"; exit 1; }
          echo "font license files staged: $n"

  # --------------------------------------------------------------------------
  # Build a release binary per OS/arch + per-binary SLSA provenance attestation.
  # --------------------------------------------------------------------------
  build:
    needs: license-delivery
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Required to mint the Sigstore signing cert + write the attestation.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # The full Windows + Linux + macOS desktop matrix, x64 and ARM64, each
        # built on a NATIVE GitHub-hosted runner (no cross-linkers) — except the
        # Intel-mac target, which the universal Apple toolchain cross-builds on
        # the Apple-Silicon runner. Free arm64 public-repo runners
        # (ubuntu-24.04-arm / windows-11-arm) went GA 2025-08-07. These six
        # triples match the update-manifest's platform classifier.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # x86_64 mac is cross-built on the Apple-Silicon runner via the
          # universal Apple toolchain (rustup adds the target; clang emits a
          # native x86_64 Mach-O). This avoids the scarce/queue-starved macos-13
          # Intel runner — the arm64 leg above already proves the macOS build.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - name: Harden the runner (egress audit)
        # step-security/harden-runner@v2.19.4
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain @master commit
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-auditable
        # SBOM-in-binary: `cargo auditable build` embeds the dependency tree
        # (versions + sources) into a `.dep-v0` section of the shipped binary,
        # so it self-describes and can be audited post-hoc with `cargo audit
        # bin <binary>` even without the source tree. This is a build-wrapper
        # only — it does not change the binary's runtime behavior or add a
        # runtime dependency.
        # taiki-e/install-action@v2.79.10 — reproducible prebuilt-tool install.
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9
        with:
          tool: cargo-auditable

      - name: Cache cargo registry and target
        # Swatinem/rust-cache@v2.9.1
        # zizmor: ignore[cache-poisoning]
        # zizmor's cache-poisoning heuristic is Low-confidence and fires on the
        # mere presence of rust-cache in a tag-triggered job; it does not parse
        # `save-if`. We set `save-if: false` below so this step is RESTORE-ONLY
        # and can never persist a poisoned cache. The residual restore risk is
        # neutralised by `--locked` builds. Annotation documents the disposition.
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}
          # zizmor cache-poisoning remedy: this release job runs on tag pushes
          # (a privileged, artifact-producing context). Restore caches but never
          # SAVE one from here, so a release build can never persist a poisoned
          # cache that a later build would restore. Builds use `--locked` so a
          # cold cache only costs time, not correctness.
          # https://docs.zizmor.sh/audits/#cache-poisoning
          save-if: false

      - name: Install Linux GUI/display build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev

      - name: Build release binary (with embedded SBOM)
        # `cargo auditable build` is a drop-in wrapper for `cargo build` that
        # embeds the dependency tree into the binary (auditable post-hoc via
        # `cargo audit bin`). Same flags as a plain release build; runtime
        # behavior is unchanged.
        run: cargo auditable build --release --locked --target ${{ matrix.target }} --bin ${{ env.BIN_NAME }}

      - name: Determine version
        id: version
        shell: bash
        # zizmor template-injection remedy: pass workflow context through the
        # `env:` block so the values arrive as shell variables, never as raw
        # `${{ ... }}` text spliced into the script body. See
        # https://docs.zizmor.sh/audits/#template-injection
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # zizmor template-injection remedy: context values via `env:`, not
        # spliced into the script body.
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          target="${TARGET}"
          stage="${BIN_NAME}-${tag}-${target}"
          mkdir -p "dist/${stage}"
          cp "target/${target}/release/${BIN_NAME}" "dist/${stage}/"
          cp README.md "dist/${stage}/"
          # License delivery is MANDATORY, not best-effort. The binary embeds
          # ~21 OFL-1.1 / Apache-2.0 typefaces via include_bytes!, and OFL-1.1
          # s2 requires the license text to accompany every copy. This staging
          # step fails the build if any bundled font's license is missing, so an
          # artifact can never ship without it. (Previously this was
          # `cp LICENSE-* README.md … 2>/dev/null || true` — best-effort, no
          # font licenses at all, and silent on failure.)
          sh packaging/collect-licenses.sh "${PWD}" "dist/${stage}"
          ( cd dist && tar -czf "${stage}.tar.gz" "${stage}" )
          ( cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256" )
          echo "artifact=dist/${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # zizmor template-injection remedy: context values via `env:`, not
        # spliced into the script body.
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:TAG
          $target = $env:TARGET
          $stage = "$env:BIN_NAME-$tag-$target"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item "target/$target/release/$env:BIN_NAME.exe" "dist/$stage/"
          Copy-Item "README.md" "dist/$stage/"
          # License delivery is MANDATORY (see the Unix packaging step). The
          # collector is POSIX sh; the windows-latest runner ships Git Bash, so
          # invoke it via `bash`. A non-zero exit MUST fail the job -- an
          # artifact that ships embedded OFL-1.1 fonts without their license
          # text is a license breach.
          bash packaging/collect-licenses.sh "$(Get-Location)" "dist/$stage"
          if ($LASTEXITCODE -ne 0) { throw "license collection failed" }
          Compress-Archive -Path "dist/$stage/*" -DestinationPath "dist/$stage.zip" -Force
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          # NOT `Out-File`: it terminates the line with CRLF, so the filename
          # field in the published SHA256SUMS ends with a stray CR. Verified in
          # the shipped v0.4.25 SHA256SUMS - both Windows .zip lines read
          # `...-pc-windows-msvc.zip\r` while every Unix line is clean. That
          # breaks any exact-name lookup (`awk '$2 == name'`, `grep -E 'name$'`)
          # and makes `sha256sum -c SHA256SUMS` look for a file whose name
          # contains a carriage return.
          # `-NoNewline` suppresses Set-Content's own CRLF terminator; the
          # backtick-n inside the string is the single LF we do want.
          Set-Content -Path "dist/$stage.zip.sha256" -Encoding ascii -NoNewline `
            -Value "$hash  $stage.zip`n"
          "artifact=dist/$stage.zip" | Out-File -Encoding ascii -Append $env:GITHUB_ENV

      - name: Attest build provenance (SLSA)
        # actions/attest-build-provenance@v4.1.0
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: ${{ env.artifact }}

      - name: Upload build artifacts
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            ./dist/*.tar.gz
            ./dist/*.zip
            ./dist/*.sha256
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # CycloneDX SBOM for the whole workspace, published with the release.
  # --------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (egress audit)
        # step-security/harden-runner@v2.19.4
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain @master commit
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx (version-pinned via cargo install)
        # Pin the SBOM generator to an EXACT version with `--locked` so the SBOM
        # tooling itself is reproducible release-to-release (a moving installer
        # tag could silently change the CycloneDX spec version or output shape).
        # `cargo install --locked` builds from crates.io against the tool's own
        # committed Cargo.lock — no surprise transitive drift.
        run: cargo install cargo-cyclonedx --locked --version 0.5.7

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          # NOTE: do NOT pass `--override-filename` — it renames output to
          # `<name>.json` (dropping the `.cdx` infix) AND collides all workspace
          # members onto one filename, so the `*.cdx.json` collector below found
          # nothing and the job failed. Default naming writes one
          # `<crate>.cdx.json` per member (c0pl4nd / c0pl4nd-core /
          # c0pl4nd-renderer), which the collector + attest glob match.
          cargo cyclonedx --all --format json
          # cargo-cyclonedx writes one `<crate>.cdx.json` per workspace member.
          # Ship ONLY the top-level app SBOM (`c0pl4nd.cdx.json`): it is the
          # dependency SUPERSET — c0pl4nd-core and c0pl4nd-renderer are deps of the
          # app, so their trees are already inside it, and we ship only the app
          # binary. Collecting the two library SBOMs too was pure release-asset
          # noise (they duplicate subtrees of the app SBOM for crates we never ship
          # standalone). One SBOM, one attestation, one published asset.
          find . -name 'c0pl4nd.cdx.json' -not -path './target/*' -exec cp {} sbom/ \;
          ls -la sbom
          # Fail loudly if the app SBOM was not produced (don't ship without it).
          test "$(find sbom -name 'c0pl4nd.cdx.json' | wc -l)" -gt 0

      - name: Record toolchain build-provenance (rustc -vV + pin hash)
        # Reproducible-build provenance text artifact. Captures the EXACT compiler
        # identity (`rustc -vV` → version, commit-hash, commit-date, llvm) plus the
        # committed `rust-toolchain.toml` pin and its SHA-256, so a downstream
        # verifier can confirm which toolchain produced a given release. This is
        # the plain-text complement to the SLSA attestation: human-readable, and
        # it survives even when the attestation infra is unavailable.
        run: |
          set -euo pipefail
          mkdir -p sbom
          prov="sbom/BUILD-PROVENANCE.txt"
          {
            echo "C0PL4ND build provenance"
            echo "tag: ${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
            echo "commit: ${GITHUB_SHA}"
            echo "generated-at-utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=== rustc -vV ==="
            rustc -vV
            echo
            echo "=== cargo --version ==="
            cargo --version
            echo
            echo "=== rust-toolchain.toml (pinned channel) ==="
            if [ -f rust-toolchain.toml ]; then
              cat rust-toolchain.toml
              echo
              echo "rust-toolchain.toml sha256: $(sha256sum rust-toolchain.toml | cut -d' ' -f1)"
            else
              echo "(rust-toolchain.toml not present)"
            fi
          } > "$prov"
          echo "--- ${prov} ---"
          cat "$prov"

      - name: Attest SBOM provenance
        # actions/attest-build-provenance@v4.1.0
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: "sbom/*.cdx.json"

      - name: Upload SBOM + build-provenance artifact
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: |
            sbom/*.cdx.json
            sbom/BUILD-PROVENANCE.txt
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Brand rasters for the Windows installer — generated on Linux (clean librsvg
  # rasterization) and handed to the Windows packaging job. The Itasha.Corp
  # installer framework (F0RG3-W1R3) owns the branding + NSIS config; only the
  # compiled binary crosses from this repo (binary-input-contract).
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # Windows installer — the native Itasha.Corp CRT provisioning-console installer
  # (F0RG3-W1R3, Rust/eframe). Replaces the stock NSIS: the compiled binary +
  # assets are the payload; the installer is brand-themed, per-machine (pre-fills
  # C:\Program Files\Itasha.Corp\C0PL4ND), and reusable across apps. SignPath
  # Foundation signing is gated on SIGNPATH_ORG_ID (unsigned otherwise).
  # --------------------------------------------------------------------------
  windows-installer:
    name: Windows installer (native CRT)
    needs: build
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Checkout C0PL4ND (assets + licenses)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app
          persist-credentials: false
      - name: Checkout installer framework (F0RG3-W1R3)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 46b-ETYKiAL/Itasha.Corp_F0RG3-W1R3
          path: framework
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Cache cargo + installer target
        # Swatinem/rust-cache@v2.9.1 — restore-only on tag builds (no poisoned save)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: framework/installer -> target
          key: native-installer
          save-if: false
      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: c0pl4nd-x86_64-pc-windows-msvc
          path: winbin
      - name: Assemble payload (binary + assets + licenses)
        shell: bash
        run: |
          set -euo pipefail
          zip="$(find winbin -name '*.zip' | head -1)"
          [ -n "$zip" ] || { echo "no windows binary zip under winbin/"; exit 1; }
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('winbin/x')" "$zip"
          exe="$(find winbin/x -name 'c0pl4nd.exe' | head -1)"
          [ -n "$exe" ] || { echo "c0pl4nd.exe not found"; exit 1; }
          mkdir -p payload
          cp "$exe" payload/
          # NOTE: `app/assets` is the repo-ROOT assets dir — icons and media
          # only. C0PL4ND's bundled typefaces live under
          # `app/crates/app/assets/fonts/`, so this copy picks up ZERO font
          # licenses. (The sibling SCR1B3 repo has the identical line and it
          # *does* catch its fonts purely because its fonts sit at the repo
          # root — the same line is load-bearing there and inert here.)
          # The collector below is what actually satisfies OFL-1.1 s2.
          if [ -d app/assets ]; then cp -r app/assets payload/assets; fi
          [ -f app/README.md ] && cp app/README.md payload/
          sh app/packaging/collect-licenses.sh "app" payload
          echo "payload contents:"; find payload -maxdepth 2 | head -40
          echo "font licenses in payload: $(find payload/licenses/fonts -type f 2>/dev/null | wc -l)"
      - name: Build native installer
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-out
          python framework/scripts/build_native_installer.py \
            --app c0pl4nd \
            --binary-dir payload \
            --version "$TAG" \
            --out "dist-out/c0pl4nd-${TAG}-x86_64-setup.exe"
          ls -la dist-out
      # --- SignPath Foundation signing (gated; inactive until SIGNPATH_ORG_ID set) ---
      - name: Upload unsigned installer (for SignPath)
        id: unsigned
        if: vars.SIGNPATH_ORG_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-installer
          path: dist-out/*.exe
      - name: Sign via SignPath Foundation
        if: vars.SIGNPATH_ORG_ID != ''
        # SignPath/github-action-submit-signing-request@v2
        uses: SignPath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: c0pl4nd
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-out
      - name: Checksum installer (final, signed-or-unsigned)
        shell: bash
        run: |
          set -euo pipefail
          cd dist-out
          for e in *.exe; do sha256sum "$e" > "$e.sha256"; done
          cat *.sha256
      - name: Attest installer provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist-out/*.exe
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installer
          path: dist-out/
          if-no-files-found: error

  windows-msi:
    # The MSI. Before this job there was NO WiX or cargo-wix anywhere in the
    # repo: `packaging/windows/c0pl4nd.wxs` had never been compiled by CI or
    # locally, and its own header comment claimed a release.yml "msi" job built
    # it — a job that did not exist. So the file was never validated by anything
    # except the notify_tests, which parse it as TEXT.
    #
    # That comment is now corrected and the file is WiX v3 schema (it was
    # authored against the WiX v4/v6 schema, which candle/light cannot read at
    # all). This is deliberately the SAME toolchain and the SAME job shape the
    # sibling SCR1B3 repo already runs on a real runner — pinned + checksummed
    # WiX 3.14.1, candle, light with ICE validation left ON, then a dark
    # decompile that reads the built package back out — rather than a second,
    # divergent installer toolchain in the fleet.
    #
    # Like SCR1B3's, it CONSUMES the `build` job's artifact instead of
    # rebuilding, so the .exe inside the MSI is byte-identical to the one in the
    # published .zip: same cargo-auditable SBOM, same hardening, one build.
    name: Windows installer (.msi)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # WiX 3.x, pinned to a release asset + SHA-256 rather than relying on
      # whatever the runner image preinstalls, so a runner image change cannot
      # silently swap the compiler under the gate. Kept byte-identical to
      # SCR1B3's job — if one moves, move both.
      WIX_URL: "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
      WIX_SHA256: "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31"
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Checkout C0PL4ND (installer source + icon + license)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: c0pl4nd-x86_64-pc-windows-msvc
          path: winbin
      - name: Stage the released binary as the MSI payload
        shell: bash
        run: |
          set -euo pipefail
          zip="$(find winbin -name '*.zip' | head -1)"
          [ -n "$zip" ] || { echo "::error::no windows binary zip under winbin/"; exit 1; }
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('winbin/x')" "$zip"
          exe="$(find winbin/x -name 'c0pl4nd.exe' | head -1)"
          [ -n "$exe" ] || { echo "::error::c0pl4nd.exe not found in the release zip"; exit 1; }
          mkdir -p payload
          cp "$exe" payload/
          ls -la payload/c0pl4nd.exe
      - name: Install WiX 3.14 (pinned + checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSLf -o wix314-binaries.zip "$WIX_URL"
          # Verify BEFORE extracting: an unverified archive is never unpacked.
          echo "${WIX_SHA256}  wix314-binaries.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wix"
          if command -v unzip >/dev/null 2>&1; then
            unzip -q -o wix314-binaries.zip -d "$RUNNER_TEMP/wix"
          elif command -v 7z >/dev/null 2>&1; then
            7z x -y -o"$RUNNER_TEMP/wix" wix314-binaries.zip > /dev/null
          else
            echo "::error::no archive extractor available (tried unzip, 7z)"
            exit 1
          fi
          for t in candle.exe light.exe dark.exe; do
            [ -f "$RUNNER_TEMP/wix/$t" ] || { echo "::error::WiX archive did not contain $t"; exit 1; }
          done
      - name: Compile the installer source (candle)
        shell: bash
        run: |
          set -euo pipefail
          # No Rust toolchain in this job (it builds nothing). The workspace root
          # carries the real version; the c0pl4nd crate inherits it via
          # `version.workspace = true`.
          VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          # WiX requires x.x.x.x with each field <= 65534, so a non-numeric or
          # empty version must stop here rather than reach candle as garbage.
          echo "$VER" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$' \
            || { echo "::error::could not resolve a numeric version (got '$VER')"; exit 1; }
          echo "installer version = $VER"
          # candle runs from the repo root, which is what the .wxs's
          # packaging\windows\... SourceFile/Value paths are relative to.
          BIN_DIR="$(pwd -W)/payload"
          "$RUNNER_TEMP/wix/candle.exe" -nologo -arch x64 \
            -dVersion="$VER" -dCargoTargetBinDir="$BIN_DIR" \
            -out c0pl4nd.wixobj packaging/windows/c0pl4nd.wxs
          [ -s c0pl4nd.wixobj ] || { echo "::error::candle reported success but produced no .wixobj"; exit 1; }
      - name: Link the installer (light, with ICE validation)
        shell: bash
        # ICE validation is ON and NOTHING is suppressed. Unlike SCR1B3 — which
        # is a strictly perUser package and therefore needs -sice:ICE38 — this
        # package is perMachine and links clean with zero -sice flags. Keep it
        # that way: an ICE here is a real defect in the .wxs, not a flag to add.
        #
        # The one thing that had to be got right for that: ApplicationShortcut's
        # KeyPath must be HKCU. ICE57 classifies a ProgramMenuFolder shortcut as
        # per-user data, so an HKMU KeyPath fails with LGHT0204/ICE57 "has both
        # per-user data and a keypath that can be either per-user or
        # per-machine". The genuinely per-machine rows (the exe + PATH, and the
        # HKLM shell verbs) live in their own Win64 components for the same
        # reason.
        #
        # ICE61 is emitted as warning LGHT1076 (MajorUpgrade
        # AllowSameVersionUpgrades="yes" makes Maximum == current). light exits
        # 0, so it is not suppressed — same treatment SCR1B3 gives ICE91.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wix/light.exe" -nologo \
            -ext WixUIExtension -ext WixUtilExtension \
            -out c0pl4nd-installer.msi c0pl4nd.wixobj
          [ -f c0pl4nd-installer.msi ] || { echo "::error::light reported success but produced no .msi"; exit 1; }
          # light writes the .msi BEFORE ICE validation runs, so "the file
          # exists" is not by itself proof the link succeeded -- `set -e` on
          # light's exit status is what enforces that. This size floor is the
          # separate check that the package is not a degenerate stub.
          sz=$(wc -c < c0pl4nd-installer.msi)
          echo "MSI size = $sz bytes"
          [ "$sz" -gt 100000 ] || { echo "::error::MSI is implausibly small ($sz bytes)"; exit 1; }
      - name: Assert the compiled MSI carries the AUMID and the shell verbs
        shell: bash
        # Reads the tables back out of the BUILT package (via WiX's own
        # decompiler) instead of trusting the source text. This is what upgrades
        # the notify_tests' premise from assumed to verified: those tests prove
        # c0pl4nd.wxs's TEXT carries System.AppUserModel.ID == notify::AUMID;
        # this proves the package that would actually ship carries it. Without
        # the AUMID in the shipped MSI, every toast the app raises is accepted by
        # the shell and silently never displayed.
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wix/dark.exe" -nologo c0pl4nd-installer.msi -out decompiled.wxs
          [ -s decompiled.wxs ] || { echo "::error::dark produced no output"; exit 1; }
          src=$(grep -oE 'pub const AUMID: &str = "[^"]+"' crates/app/src/notify.rs \
                | sed -E 's/.*"([^"]+)"/\1/')
          built=$(grep -oE 'Key="System.AppUserModel.ID" Value="[^"]+"' decompiled.wxs \
                | sed -E 's/.*Value="([^"]+)"/\1/')
          echo "AUMID: source='$src' compiled='$built'"
          # Both must be non-empty: two empty strings would compare equal and
          # make this assertion vacuously true.
          [ -n "$src" ] || { echo "::error::could not read notify::AUMID from notify.rs"; exit 1; }
          [ -n "$built" ] || { echo "::error::the compiled MSI carries NO System.AppUserModel.ID -- every toast would be silently swallowed."; exit 1; }
          [ "$src" = "$built" ] || { echo "::error::AUMID mismatch: notify.rs '$src' != compiled MSI '$built'"; exit 1; }
          verbs=$(grep -c 'C0pl4ndOpenHere' decompiled.wxs || true)
          echo "shell-verb registry rows in the compiled MSI: $verbs"
          [ "$verbs" -ge 8 ] || { echo "::error::the 'Open C0PL4ND here' shell verb did not make it into the package (found $verbs rows)"; exit 1; }
      - name: Name + checksum the release asset
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-msi
          T="${TAG//\//-}"
          mv c0pl4nd-installer.msi "dist-msi/c0pl4nd-${T}-x86_64-pc-windows-msvc.msi"
          cd dist-msi
          # Unconditional, exactly like the native-CRT installer job above. This
          # deliberately does NOT copy the `build` job's
          # `if command -v sha256sum ... || true` form, which silently skips the
          # checksum on any runner that lacks sha256sum. This job only runs on
          # windows-latest, where Git-Bash always provides it, so a failure here
          # is a real failure.
          for m in *.msi; do sha256sum "$m" > "$m.sha256"; done
          ls -la; cat *.sha256
      - name: Attest MSI provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist-msi/*.msi
      - name: Upload MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-msi
          path: dist-msi/
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Brand rasters. C0PL4ND commits only SVG sources (assets/svg/) plus a single
  # 256px PNG + .ico under packaging/windows — there is NO hicolor PNG tree and
  # no .icns, which is why the .deb / AppImage / .dmg first-install artifacts
  # could not be built. `packaging/gen-icons.sh` renders the whole size ladder
  # (16..1024) from the SVG masters; it is run ONCE here on Linux (clean librsvg
  # rasterization, the same rationale the Windows-installer job already states)
  # and handed to the packaging jobs as an artifact, so macOS does not need a
  # brew librsvg install and both platforms rasterize identically.
  # --------------------------------------------------------------------------
  brand-icons:
    name: Brand rasters (librsvg)
    needs: license-delivery
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install librsvg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render icon ladder
        run: |
          set -euo pipefail
          sh packaging/gen-icons.sh
          ls -la packaging/icons
          # gen-icons.sh warns-and-skips .ico/.icns when ImageMagick/iconutil are
          # absent (both are absent on this runner), which is fine — the PNG
          # ladder is what the packaging jobs consume. But a MISSING ladder would
          # silently produce an icon-less .deb/.dmg, so assert it.
          for s in 16 32 48 64 128 256 512 1024; do
            [ -s "packaging/icons/c0pl4nd-${s}.png" ] \
              || { echo "::error::packaging/icons/c0pl4nd-${s}.png was not rendered"; exit 1; }
          done
      - name: Upload brand rasters
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: brand-icons
          path: packaging/icons/*.png
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Linux first-install artifacts (.deb + AppImage) built from the SAME compiled
  # x86_64 binary the `build` job produced. C0PL4ND previously shipped only raw
  # .tar.gz archives on Linux while the sibling SCR1B3 shipped both installers;
  # this closes that gap. These are NOT auto-update targets — the in-app updater
  # swaps the binary in place via the signed latest.json, which lists only the
  # archives/installers. `packaging/linux/build-deb.sh` and `build-appimage.sh`
  # are deliberately NOT used: they are maintainer's-machine skeletons that read
  # `packaging/icons/c0pl4nd.png` (previously absent) and auto-download an
  # UNPINNED linuxdeploy. This job instead mirrors SCR1B3's proven, shipping
  # release path, including the pinned + sha256-verified appimagetool.
  # --------------------------------------------------------------------------
  linux-installers:
    name: Linux installers (.deb + AppImage)
    needs: [build, brand-icons]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Checkout C0PL4ND (packaging + assets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app
          persist-credentials: false
      - name: Download Linux binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: c0pl4nd-x86_64-unknown-linux-gnu
          path: linbin
      - name: Download brand rasters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: brand-icons
          path: icons
      - name: Build .deb (dpkg-deb) + AppImage (appimagetool, pinned)
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Asset-name tag: the release tag on a tag push; the dispatch input
          # otherwise. The .deb Version field needs a clean semver, so derive
          # that from the workspace Cargo.toml — valid for both trigger types.
          TAG="${TAG//\//-}"
          VER="$(grep -m1 '^version' app/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tgz="$(find linbin -name '*x86_64-unknown-linux-gnu.tar.gz' | head -1)"
          [ -n "$tgz" ] || { echo "::error::no linux tarball under linbin/"; exit 1; }
          mkdir -p dist stage-bin
          # C0PL4ND's tarball wraps its payload in a `c0pl4nd-<tag>-<target>/`
          # directory (SCR1B3's does not), so strip that level.
          tar -xzf "$tgz" -C stage-bin --strip-components=1
          [ -f stage-bin/c0pl4nd ] || { echo "::error::c0pl4nd not found in tarball"; exit 1; }
          chmod 0755 stage-bin/c0pl4nd

          # Stage the hicolor icon tree once; both artifacts consume it.
          hic=stage-icons/hicolor
          rm -rf stage-icons
          for s in 16 32 48 64 128 256 512; do
            mkdir -p "${hic}/${s}x${s}/apps"
            cp "icons/c0pl4nd-${s}.png" "${hic}/${s}x${s}/apps/c0pl4nd.png"
          done

          # ---- .deb (dpkg-deb, preinstalled on ubuntu-latest) ----------------
          deb=stage-deb
          rm -rf "$deb"
          mkdir -p "$deb/usr/bin" "$deb/usr/share/applications" \
                   "$deb/usr/share/icons/hicolor" "$deb/usr/share/man/man1" "$deb/DEBIAN"
          install -m0755 stage-bin/c0pl4nd "$deb/usr/bin/c0pl4nd"
          # License texts at the Debian-standard location. Mandatory: the
          # collector fails the job if any bundled font's license is missing
          # (OFL-1.1 s2 — the license must accompany every copy).
          mkdir -p "$deb/usr/share/doc/c0pl4nd"
          sh app/packaging/collect-licenses.sh app "$deb/usr/share/doc/c0pl4nd"
          install -m0644 app/packaging/linux/c0pl4nd.desktop "$deb/usr/share/applications/c0pl4nd.desktop"
          cp -r "${hic}/." "$deb/usr/share/icons/hicolor/"
          gzip -9nc app/man/c0pl4nd.1 > "$deb/usr/share/man/man1/c0pl4nd.1.gz"
          # Control file: reuse the committed BINARY control template. NOTE the
          # repo also has `packaging/linux/debian/control`, which is a SOURCE
          # control carrying `${shlibs:Depends}, ${misc:Depends}` — debhelper
          # substvars that dpkg-deb does NOT expand, so using it directly would
          # emit a package whose Depends field contains literal `${...}` and is
          # uninstallable. `debian-control` is the binary template.
          size_kb="$(du -ks "$deb/usr" | cut -f1)"
          sed -E "s/^Version: .*/Version: ${VER}/" app/packaging/linux/debian-control > "$deb/DEBIAN/control"
          printf 'Installed-Size: %s\n' "$size_kb" >> "$deb/DEBIAN/control"
          if grep -q '[$]{' "$deb/DEBIAN/control"; then
            echo "::error::unexpanded substvar in DEBIAN/control"; exit 1
          fi
          dpkg-deb --build --root-owner-group "$deb" "dist/c0pl4nd-${TAG}-amd64.deb"
          echo "----- .deb info -----";     dpkg-deb --info     "dist/c0pl4nd-${TAG}-amd64.deb"
          echo "----- .deb contents -----"; dpkg-deb --contents "dist/c0pl4nd-${TAG}-amd64.deb"
          command -v desktop-file-validate >/dev/null && \
            desktop-file-validate "$deb/usr/share/applications/c0pl4nd.desktop" || true

          # ---- AppImage (appimagetool 1.9.1, pinned + sha256-verified) -------
          appdir=AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" "$appdir/usr/share/icons/hicolor"
          install -m0755 stage-bin/c0pl4nd "$appdir/usr/bin/c0pl4nd"
          mkdir -p "$appdir/usr/share/doc/c0pl4nd"
          sh app/packaging/collect-licenses.sh app "$appdir/usr/share/doc/c0pl4nd"
          install -m0644 app/packaging/linux/c0pl4nd.desktop "$appdir/usr/share/applications/c0pl4nd.desktop"
          install -m0644 app/packaging/linux/c0pl4nd.desktop "$appdir/c0pl4nd.desktop"   # top-level (required)
          cp -r "${hic}/." "$appdir/usr/share/icons/hicolor/"
          install -m0644 "icons/c0pl4nd-256.png" "$appdir/c0pl4nd.png"                   # top-level icon
          # AppRun via printf (NOT a heredoc — a YAML-indented heredoc would inject
          # leading spaces into the `#!` shebang line and break it).
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/c0pl4nd" "$@"\n' > "$appdir/AppRun"
          chmod 0755 "$appdir/AppRun"
          # Pinned, immutable appimagetool release + digest (supply-chain: no
          # rolling `continuous` tag; sha256 verified before exec). Same pin the
          # sibling SCR1B3 release already uses.
          AIT_URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          AIT_SHA="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl -fsSL --retry 3 -o appimagetool "$AIT_URL"
          echo "${AIT_SHA}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          # `--appimage-extract-and-run` avoids needing FUSE on the CI runner.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" "dist/C0PL4ND-${TAG}-x86_64.AppImage"

          # ---- checksums (the release job aggregates these into SHA256SUMS) --
          cd dist
          for f in *.deb *.AppImage; do
            [ -f "$f" ] || { echo "::error::expected artifact $f was not produced"; exit 1; }
            sha256sum "$f" > "$f.sha256"
          done
          ls -la; cat *.sha256
      - name: Attest Linux installer provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            dist/*.deb
            dist/*.AppImage
      - name: Upload Linux installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-installers
          path: dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # macOS first-install artifact (.dmg) built from the compiled binary, one per
  # arch. C0PL4ND previously shipped raw .tar.gz on macOS only, so a Mac user got
  # no drag-to-Applications install at all. `packaging/macos/build-dmg.sh` is not
  # used: it requires a committed `packaging/macos/c0pl4nd.icns` that does not
  # exist in the repo. The .icns is generated here from the rendered PNG ladder
  # via iconutil (preinstalled on macOS runners).
  # --------------------------------------------------------------------------
  macos-installer:
    name: macOS installer (.app + .dmg, ${{ matrix.arch }})
    needs: [build, brand-icons]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
      - name: Checkout C0PL4ND (packaging + assets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app
          persist-credentials: false
      - name: Download macOS binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: c0pl4nd-${{ matrix.target }}
          path: macbin
      - name: Download brand rasters
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: brand-icons
          path: icons
      - name: Build .app bundle + .dmg
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TAG//\//-}"
          VER="$(grep -m1 '^version' app/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tgz="$(find macbin -name '*.tar.gz' | head -1)"
          [ -n "$tgz" ] || { echo "::error::no macOS tarball under macbin/"; exit 1; }
          mkdir -p dist stage-bin
          tar -xzf "$tgz" -C stage-bin --strip-components=1
          [ -f stage-bin/c0pl4nd ] || { echo "::error::c0pl4nd not found in tarball"; exit 1; }

          # ---- C0PL4ND.app bundle --------------------------------------------
          appbundle="C0PL4ND.app"
          rm -rf "$appbundle"
          mkdir -p "$appbundle/Contents/MacOS" "$appbundle/Contents/Resources"
          install -m0755 stage-bin/c0pl4nd "$appbundle/Contents/MacOS/c0pl4nd"
          # License texts inside the bundle (OFL-1.1 s2). Mandatory: the
          # collector fails the job rather than shipping a breach.
          sh app/packaging/collect-licenses.sh app "$appbundle/Contents/Resources/licenses"
          # Info.plist: reuse the committed template, substituting the real
          # version into the two 0.1.0 placeholders (CFBundleVersion +
          # CFBundleShortVersionString).
          sed -E "s|<string>0\.1\.0</string>|<string>${VER}</string>|g" \
            app/packaging/macos/Info.plist > "$appbundle/Contents/Info.plist"
          # .icns from the rendered ladder (iconutil is preinstalled). The plist
          # declares CFBundleIconFile c0pl4nd.icns, so the name must match.
          iconset="c0pl4nd.iconset"
          rm -rf "$iconset"; mkdir -p "$iconset"
          cp icons/c0pl4nd-16.png   "$iconset/icon_16x16.png"
          cp icons/c0pl4nd-32.png   "$iconset/icon_16x16@2x.png"
          cp icons/c0pl4nd-32.png   "$iconset/icon_32x32.png"
          cp icons/c0pl4nd-64.png   "$iconset/icon_32x32@2x.png"
          cp icons/c0pl4nd-128.png  "$iconset/icon_128x128.png"
          cp icons/c0pl4nd-256.png  "$iconset/icon_128x128@2x.png"
          cp icons/c0pl4nd-256.png  "$iconset/icon_256x256.png"
          cp icons/c0pl4nd-512.png  "$iconset/icon_256x256@2x.png"
          cp icons/c0pl4nd-512.png  "$iconset/icon_512x512.png"
          cp icons/c0pl4nd-1024.png "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o "$appbundle/Contents/Resources/c0pl4nd.icns"

          # ---- .dmg (hdiutil, preinstalled) — drag-to-Applications layout ----
          stage="dmg-stage"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R "$appbundle" "$stage/"
          ln -s /Applications "$stage/Applications"
          dmg="dist/c0pl4nd-${TAG}-${{ matrix.arch }}.dmg"
          hdiutil create -volname "C0PL4ND" -srcfolder "$stage" -ov -format UDZO "$dmg"

          # ---- checksum. macOS ships `shasum`, NOT `sha256sum`; using the
          # latter unguarded would fail the step, and using it GUARDED
          # (`if command -v sha256sum`) would silently skip the checksum, drop
          # this artifact's line from SHA256SUMS, and leave the .dmg with no
          # integrity record at all.
          cd dist
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la; cat *.sha256
      - name: Attest macOS installer provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/*.dmg
      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-installer-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, sbom, windows-installer, windows-msi, brand-icons, linux-installers, macos-installer]
    runs-on: ubuntu-latest
    permissions:
      # The only job that needs write to create the release + upload assets.
      contents: write
      # Tier 2: SLSA build-provenance attestation over the FINAL published asset
      # set (not just the per-job artifacts) needs OIDC + attestations write.
      id-token: write
      attestations: write
    # NO `always()`. With it, this job ran whenever `build` succeeded and the
    # other three entries in `needs:` were decorative — a failed `sbom`,
    # `windows-installer` or `windows-msi` still published the release, silently
    # missing the asset that job produces. Without it, GitHub's default applies:
    # the job runs only when EVERY `needs:` entry succeeded, which is what
    # listing them was for. (`needs.build.result == 'success'` is then implied,
    # so it is gone too — a redundant condition invites re-adding `always()` to
    # "make it work".)
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Harden the runner (egress audit)
        # step-security/harden-runner@v2.19.4
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit

      - name: Checkout source (for the embedded-key self-verify gate)
        # The release job otherwise only downloads built artifacts — it has no
        # source tree. The fail-closed verify gate below reconstructs the SAME
        # public key the deployed client embeds from update_engine/verify.rs, so
        # the source must be present. Checkout into an isolated `src/` subdir so
        # it never collides with the `artifacts/` + `release/` asset dirs.
        # actions/checkout@v4.2.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: src
          persist-credentials: false

      - name: Download all artifacts
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Flatten artifacts + aggregate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.sha256' -o -name '*.cdx.json' -o -name 'BUILD-PROVENANCE.txt' \) \
            -exec cp {} release/ \;
          # NOT `cat *.sha256 > SHA256SUMS 2>/dev/null || true`. That form
          # publishes an EMPTY SHA256SUMS when the glob misses - and an empty
          # SHA256SUMS still satisfies the `[ -f ]` keep-guard in the prune step
          # while making every consumer's digest lookup fail. Since the prune
          # deletes the per-binary sidecars, SHA256SUMS is the ONLY checksum
          # record that ships; producing it silently empty is the worst
          # available outcome. Fail loudly instead.
          mapfile -t shas < <(find release -maxdepth 1 -type f -name '*.sha256' | sort)
          if [ "${#shas[@]}" -eq 0 ]; then
            echo "::error::no .sha256 sidecars staged - refusing to publish a release with no checksum manifest"
            exit 1
          fi
          # `tr -d '\r'` is defence-in-depth for the CRLF a Windows producer can
          # introduce (see the `Package (Windows)` step). A single stray CR in a
          # filename field silently breaks every exact-name lookup downstream.
          cat "${shas[@]}" | tr -d '\r' | sort -u > release/SHA256SUMS
          [ -s release/SHA256SUMS ] || { echo "::error::SHA256SUMS is empty"; exit 1; }
          if LC_ALL=C grep -q $'\r' release/SHA256SUMS; then
            echo "::error::SHA256SUMS still contains a carriage return"; exit 1
          fi
          echo "----- release/SHA256SUMS -----"; cat release/SHA256SUMS
          ls -la release

      - name: Generate update manifest (latest.json, Tier 1)
        # Tier 1 identity binding: emit a manifest that declares, per platform,
        # {asset_name, sha256, size, url} plus {version, release_index,
        # minimum_version, valid_until_utc}. It is created BEFORE the signing
        # step, so the existing sign loop produces `latest.json.minisig` and the
        # fail-closed verify gate checks it like any other asset. The in-app
        # updater (Tier 1 clients) verifies THIS manifest against the embedded
        # key, then verifies each download's SHA-256 against the signed digest
        # here — making artifact identity a SIGNED HASH, not an unsigned GitHub
        # JSON field or a tool-dependent trusted-comment string. `valid_until_utc`
        # is the freeze beacon (a stale "latest" is detectable); `minimum_version`
        # is the signed security floor. No repo checkout is needed — the manifest
        # is derived purely from the staged release/ assets + the tag.
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "$REPO" "$TAG" <<'PY'
          import sys, os, json, hashlib, datetime
          repo, tag = sys.argv[1], sys.argv[2]
          ver = tag[1:] if tag.startswith("v") else tag
          rel = "release"
          TRIPLES = (
              "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin", "aarch64-apple-darwin",
          )
          def platform_of(name):
              for t in TRIPLES:
                  if t in name:
                      return t
              # NSIS installer (c0pl4nd-<tag>-x86_64-setup.exe) is a Windows x64 asset.
              if name.endswith("setup.exe") or name.endswith(".exe"):
                  return "x86_64-pc-windows-msvc"
              return None
          def kind_of(name):
              if name.endswith(".zip"): return "zip"
              if name.endswith(".tar.gz"): return "tar.gz"
              if name.endswith(".exe"): return "exe"
              return "other"
          assets = []
          for fn in sorted(os.listdir(rel)):
              p = os.path.join(rel, fn)
              if not os.path.isfile(p):
                  continue
              if not fn.endswith((".zip", ".tar.gz", ".exe")):
                  continue            # archives/installers only (skip sidecars/SBOMs/manifest)
              plat = platform_of(fn)
              if plat is None:
                  continue
              with open(p, "rb") as fh:
                  digest = hashlib.sha256(fh.read()).hexdigest()
              assets.append({
                  "platform": plat, "kind": kind_of(fn), "asset_name": fn,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{fn}",
                  "size": os.path.getsize(p), "sha256": digest,
              })
          if not assets:
              print("::error::manifest generation found no archive/installer assets in release/")
              sys.exit(1)
          assets.sort(key=lambda a: (a["platform"], a["asset_name"]))
          core = ver.split("+")[0].split("-")[0].split(".")
          maj, minr, pat = (core + ["0", "0", "0"])[:3]
          release_index = int(maj) * 1_000_000 + int(minr) * 1_000 + int(pat)
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          fmt = "%Y-%m-%dT%H:%M:%SZ"
          manifest = {
              "schema": "itasha.update.manifest/v1",
              "product": "c0pl4nd",
              "version": ver,
              "release_index": release_index,
              # Raised to 0.4.23 (the first sidecar-tolerant updater,
              # verify_artifact_bound_optional_sig) BECAUSE this release stops
              # shipping the per-binary .minisig/.sha256. A client below this floor
              # (a pre-0.4.23 updater that still REQUIRES those sidecars) is told
              # "a fresh install is required" — a graceful message emitted BEFORE
              # it resolves a now-absent sidecar — instead of a cryptic
              # missing-sidecar failure. v0.4.23+ clients verify via the signed
              # manifest SHA-256 and auto-update seamlessly.
              "minimum_version": "0.4.23",
              "published_utc": now.strftime(fmt),
              "valid_until_utc": (now + datetime.timedelta(days=14)).strftime(fmt),
              "assets": assets,
          }
          with open(os.path.join(rel, "latest.json"), "w", encoding="utf-8") as out:
              json.dump(manifest, out, indent=2, sort_keys=True)
              out.write("\n")
          print(f"manifest: v{ver} release_index={release_index} assets={len(assets)} valid_until={manifest['valid_until_utc']}")
          PY
          echo "----- release/latest.json -----"
          cat release/latest.json

      - name: Sign release artifacts (rsign2, when key provisioned)
        # Sign every release asset with minisign (via rsign2 — the same tool the
        # key was generated with; its signatures verify against the embedded key
        # through the app's `minisign-verify` crate). Mirrors the sibling SCR1B3
        # editor's release-signing step verbatim (see SCR1B3 packaging/signing.md)
        # so both Itasha apps share ONE in-app-update signing convention. The
        # in-app updater (Settings → Updates) checks SHA-256 THEN minisign and
        # REFUSES to install anything that fails; each `<asset>` gets a
        # `<asset>.minisig` sibling (the `.sha256` siblings already exist from the
        # build job) and `files: release/*` below uploads them.
        #
        # ACTIVATION (one-time, repo owner): generate an rsign2 keypair, embed
        # the public half in `update_engine/verify.rs`, and add the secret half's
        # CONTENTS as the `MINISIGN_SECRET_KEY` Actions secret. Where the secret
        # half is kept offline is deliberately not recorded here — see
        # `packaging/signing.md`.
        # Absent → this step is a NO-OP (artifacts ship checksummed but UNSIGNED;
        # the updater then rejects them — fail-closed). The in-script guard avoids
        # the secrets-in-`if` evaluation gotcha and fails safe.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            # A stable (non-prerelease) tag has no '-' in its name (e.g. v0.4.6);
            # an rc/pre tag does (v0.4.6-rc.2). Shipping a STABLE release UNSIGNED
            # is a release-readiness landmine: the fail-closed in-app updater
            # rejects unsigned artifacts, so existing users could not auto-update
            # to it — a release that looks successful yet is un-updatable. Fail
            # loudly for stable tags; allow the unsigned path only for prereleases.
            case "${GITHUB_REF_NAME:-}" in
              *-*)
                echo "::warning::MINISIGN_SECRET_KEY not set — shipping checksummed but UNSIGNED prerelease artifacts (auto-update will reject them; acceptable for an rc/pre tag)."
                exit 0
                ;;
              *)
                echo "::error::MINISIGN_SECRET_KEY not set on a STABLE tag (${GITHUB_REF_NAME:-?}). A stable release MUST be signed — the fail-closed in-app updater rejects unsigned artifacts, so existing users could not auto-update to it. Provision the signing key (see this step's comment) or cut a prerelease (-rc/-pre) tag instead. Failing the release."
                exit 1
                ;;
            esac
          fi
          cargo install rsign2 --locked --version "^0.6"
          umask 077
          keypath="$PWD/sk.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keypath"
          count=0
          # Sign every release asset except the signatures themselves (matches the
          # in-app updater, which fetches each archive's `.minisig` sibling).
          #
          # CRITICAL: sign with the BARE filename (from INSIDE release/), so the
          # minisign trusted comment records `file:<name>` and NOT
          # `file:release/<name>`. The in-app updater binds the trusted-comment
          # `file:` token to the bare downloaded asset name; signing a path-
          # prefixed argument writes the prefix into the trusted comment and the
          # fail-closed updater rejects the artifact ("trusted-comment file
          # mismatch"), breaking auto-update for EVERY deployed client.
          while IFS= read -r f; do
            base=$(basename "$f")
            ( cd "$(dirname "$f")" && rsign sign -W -s "$keypath" -x "${base}.minisig" "$base" )
            count=$((count + 1))
          done < <(find release -type f ! -name '*.minisig')
          shred -u "$keypath" 2>/dev/null || rm -f "$keypath"
          echo "signed $count release artifact(s)"
          # ── Fail-closed verification gate (Tier 0 hardening) ───────────────
          # A green build that publishes an artifact the EMBEDDED client key
          # cannot verify is the Ollama-2026 / electron-updater-2020 fail-OPEN
          # class of bug. So before publishing we reconstruct the SAME public key
          # the deployed client embeds and cryptographically self-verify every
          # signed asset against it — plus identity, coverage, count-parity,
          # digest cross-check, and a tamper test. ANY miss fails the release.
          pub=$(grep -oE 'RW[A-Za-z0-9+/=]{40,}' src/crates/app/src/update_engine/verify.rs | head -1)
          if [ -z "$pub" ]; then
            echo "::error::could not extract the embedded public key from verify.rs — cannot self-verify the release. Aborting."
            exit 1
          fi
          printf 'untrusted comment: c0pl4nd minisign public key\n%s\n' "$pub" > rsign.pub
          assets=0; verified=0
          for f in release/*; do
            case "$f" in *.minisig) continue ;; esac
            [ -f "$f" ] || continue
            assets=$((assets + 1))
            base=$(basename "$f")
            sig="release/${base}.minisig"
            # (A) Coverage — every published asset MUST be signed.
            if [ ! -f "$sig" ]; then
              echo "::error::missing signature for $base — every published asset must be signed. Aborting."; exit 1
            fi
            # (C) Crypto-verify against the EMBEDDED client key (fail-closed).
            if ! rsign verify -p rsign.pub -x "$sig" "$f" >/dev/null 2>&1; then
              echo "::error::$base does NOT verify against the embedded public key — the deployed client would reject it. Aborting."; exit 1
            fi
            # (D) Identity — trusted-comment file: token is the BARE asset name, exact.
            ft=$(grep -m1 '^trusted comment:' "$sig" | grep -oE 'file:[^[:space:]]+' | head -1 | sed 's/^file://')
            case "$ft" in
              */*|*\\*)
                echo "::error::$sig trusted comment carries a PATH ($ft) — the updater would reject it. Aborting."; exit 1 ;;
            esac
            if [ -n "$ft" ] && [ "$ft" != "$base" ]; then
              echo "::error::$sig trusted-comment file:'$ft' != asset '$base' (wrong-artifact binding). Aborting."; exit 1
            fi
            # (F) Digest cross-check vs the .sha256 sidecar when present.
            if [ -f "release/${base}.sha256" ]; then
              want=$(awk '{print $1; exit}' "release/${base}.sha256")
              got=$(sha256sum "$f" | awk '{print $1}')
              if [ "$(printf '%s' "$want" | tr 'A-Z' 'a-z')" != "$(printf '%s' "$got" | tr 'A-Z' 'a-z')" ]; then
                echo "::error::$base sha256 sidecar mismatch (want $want got $got). Aborting."; exit 1
              fi
            fi
            verified=$((verified + 1))
          done
          # (B) Count parity — verified-asset count == signature-file count.
          nminisig=$(find release -name '*.minisig' | wc -l | tr -d ' ')
          if [ "$verified" -ne "$nminisig" ]; then
            echo "::error::signature count parity failed (verified $verified assets, $nminisig .minisig files). Aborting."; exit 1
          fi
          # (G) Tamper test — a mutated copy MUST fail verification; if it passes,
          # the gate itself is broken and we must NOT trust this run.
          orig=$(find release -type f ! -name '*.minisig' | head -1)
          if [ -n "$orig" ]; then
            tf=$(mktemp); cp "$orig" "$tf"; printf '\x00' >> "$tf"
            if rsign verify -p rsign.pub -x "release/$(basename "$orig").minisig" "$tf" >/dev/null 2>&1; then
              echo "::error::tamper test PASSED verification — the signing gate is broken. Aborting."; rm -f "$tf"; exit 1
            fi
            rm -f "$tf"
          fi
          rm -f rsign.pub
          echo "release gate GREEN: $assets artifact(s) verified against the embedded key (crypto + bare-name identity + digest + count-parity + tamper)."
          ls -la release

      - name: Prune redundant signature sidecars before publish
        # The fail-closed sign+verify gate above signs and self-verifies EVERY
        # asset (unchanged — the hardening is fully intact). We then drop, before
        # upload, every sidecar the published set no longer needs, keeping only the
        # SIGNED aggregate manifests (latest.json + SHA256SUMS and their .minisig).
        # A binary's authenticity now rests on the signed-manifest SHA-256 (the
        # in-app updater, v0.4.23+) and the signed SHA256SUMS (manual verify) — the
        # per-binary .minisig/.sha256 were redundant with both.
        #
        # SAFE for deployed clients because this release also raised the manifest
        # `minimum_version` to 0.4.23 (the first sidecar-tolerant updater): a
        # client below that floor is told "a fresh install is required" (graceful)
        # BEFORE it ever tries to resolve a now-absent sidecar — never a cryptic
        # missing-sidecar error. v0.4.23+ clients verify via the pinned signed
        # manifest hash and auto-update seamlessly.
        #
        # Deterministic and never touches a binary, latest.json, SHA256SUMS, the
        # SBOM, BUILD-PROVENANCE.txt, or the two KEPT .minisig — only per-binary
        # and derived-file signatures/checksums.
        run: |
          set -euo pipefail
          before=$(find release -type f | wc -l | tr -d ' ')
          # `.msi` entries added alongside `.exe`: the MSI job publishes an
          # installer whose `.msi.sha256` and `.msi.minisig` are redundant with
          # the signed SHA256SUMS + latest.json in exactly the same way as every
          # other binary's. Without them in this list a new MSI silently
          # re-introduces the per-binary sidecar clutter this step exists to
          # remove - the prune list must be extended for every new artifact KIND.
          find release -type f \( \
              -name '*.tar.gz.minisig' -o -name '*.zip.minisig' -o -name '*.exe.minisig' \
              -o -name '*.msi.minisig' -o -name '*.deb.minisig' \
              -o -name '*.AppImage.minisig' -o -name '*.dmg.minisig' \
              -o -name '*.tar.gz.sha256' -o -name '*.zip.sha256' -o -name '*.exe.sha256' \
              -o -name '*.msi.sha256' -o -name '*.deb.sha256' \
              -o -name '*.AppImage.sha256' -o -name '*.dmg.sha256' \
              -o -name '*.sha256.minisig' -o -name '*.cdx.json.minisig' \
              -o -name 'BUILD-PROVENANCE.txt.minisig' \
            \) -delete
          after=$(find release -type f | wc -l | tr -d ' ')
          echo "pruned $((before - after)) sidecar(s); ${after} asset(s) will be published"
          # Guard: the SIGNED aggregate manifests MUST survive the prune.
          for keep in latest.json latest.json.minisig SHA256SUMS SHA256SUMS.minisig; do
            [ -f "release/$keep" ] || { echo "::error::prune removed required $keep"; exit 1; }
          done
          # Guard: after the prune, SHA256SUMS is the ONLY integrity record any
          # consumer has for a binary (packaging/linux/install.sh reads it, and
          # the in-app updater cross-checks the signed manifest). Every published
          # artifact MUST therefore have a line in it. A missing line is a
          # silently-skipped checksum upstream, not a cosmetic gap.
          missing=0
          for a in release/*.tar.gz release/*.zip release/*.exe release/*.msi \
                   release/*.deb release/*.AppImage release/*.dmg; do
            [ -f "$a" ] || continue
            base=$(basename "$a")
            grep -qE "[ *]${base}\$" release/SHA256SUMS \
              || { echo "::error::no SHA256SUMS entry for $base"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -la release

      - name: Attest published release assets (SLSA provenance, Tier 2)
        # Tier 2: attest the FINAL published asset set as it will be uploaded —
        # archives + installer + the Tier 1 latest.json manifest + SBOMs +
        # SHA256SUMS — so a verifier can prove every released byte was built by
        # THIS workflow at THIS tag (gh attestation verify / slsa-verifier). This
        # complements (does not replace) the per-asset minisign signatures and the
        # earlier per-job attestations; it is the one attestation over the exact
        # bytes the GitHub Release publishes. The `.minisig` (signatures) and
        # `.sha256` (redundant with SHA256SUMS) sidecars are intentionally not
        # attested.
        # actions/attest-build-provenance@v4.1.0
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            release/*.zip
            release/*.tar.gz
            release/*.exe
            release/*.msi
            release/*.deb
            release/*.AppImage
            release/*.dmg
            release/latest.json
            release/*.cdx.json
            release/SHA256SUMS

      - name: Create GitHub Release
        # softprops/action-gh-release@v3.0.2
        # zizmor: ignore[superfluous-actions]
        # Deliberate: this action is SHA-pinned, gives declarative asset globs
        # (`files: release/*`), `generate_release_notes`, and prerelease
        # detection that a hand-rolled `gh release create` script would have to
        # re-implement. The functionality overlaps the runner's `gh` CLI but the
        # ergonomic + auditable surface is worth keeping; no security delta.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*

# gitleaks configuration for C0PL4ND.
#
# Extends the upstream default ruleset (so every built-in detector still runs)
# and adds a narrowly-scoped allowlist for a deterministic test sentinel that
# the `generic-api-key` heuristic flags as a false positive.
#
# Run locally:  gitleaks detect --source . --no-banner --redact
#
# This config is enforced by the `gitleaks` job in .github/workflows/ci.yml,
# which feeds the aggregating CI Gate. Note that GitHub's hosted secret
# scanning is the authoritative gate on the public repo; this is the
# local-runnable mirror and the in-PR signal.

[extend]
useDefault = true

[[rules]]
# Re-scope the built-in generic-api-key rule so the terminal round-trip test
# sentinels are not treated as credentials.
#
# These are literal marker strings that a test types into a pane and then
# waits to read back out of the grid, to prove the write->pty->parse->render
# path carried them. They are compared for equality, never authenticate
# anything, and are deliberately fixed so the assertion is deterministic.
# The allowlist is scoped BOTH by a `c0pl4nd_`-prefixed regex AND by path, so
# it cannot silently excuse a real credential elsewhere in the tree.
#
# `condition = "AND"` below is what MAKES that true, and its absence is not a
# style detail. gitleaks v8 combines allowlist criteria with OR by default, so
# without it the two criteria exempt INDEPENDENTLY: the two listed files became
# wholly exempt from this rule, and any value matching `c0pl4nd_[a-z0-9_]+`
# became exempt across the ENTIRE tree. Measured with gitleaks 8.30.1 against
# four identical planted secrets — as previously shipped, `leaks found: 1`; with
# this line, `leaks found: 4`. The comment above described the intent; this line
# implements it.
id = "generic-api-key"
[rules.allowlist]
condition = "AND"
description = "Terminal round-trip test sentinels — fixed marker strings echoed back through the pty/grid to verify the read path; not credentials."
regexes = [
  '''c0pl4nd_[a-z0-9_]+''',
]
paths = [
  '''crates/core/src/pty/mod\.rs''',
  '''crates/app/tests/egui_terminal\.rs''',
]
